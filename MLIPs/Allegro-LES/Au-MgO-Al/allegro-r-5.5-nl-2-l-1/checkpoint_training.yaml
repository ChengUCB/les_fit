# yamllint disable rule:line-length
run: [train, test]

cutoff_radius: 5.5
chemical_symbols: [O, Mg, Al, Au] 
model_type_names: ${chemical_symbols}
monitored_metric: val0_epoch/weighted_sum

data:
  _target_: nequip.data.datamodule.ASEDataModule
  seed: 456             # dataset seed for reproducibility
  
  # here we take an ASE-readable file (in extxyz format) and split it into train:val:test = 80:10:10
  split_dataset: 
    - file_path: ../data-sets/train-Au-MgO-Al.xyz
      train: 0.95
      val: 0.05

  test_file_path: ../data-sets/test-Au-MgO-Al.xyz 
  transforms:
    - _target_: nequip.data.transforms.NeighborListTransform
      r_max: ${cutoff_radius}
    - _target_: nequip.data.transforms.ChemicalSpeciesToAtomTypeMapper
      chemical_symbols: ${chemical_symbols}

  train_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 1
    num_workers: 5
    shuffle: true 
    persistent_workers: true
    prefetch_factor: 1
  val_dataloader:
    _target_: torch.utils.data.DataLoader
    batch_size: 10
    num_workers: ${data.train_dataloader.num_workers}  # we want to use the same num_workers -- variable interpolation helps
    persistent_workers: true
    prefetch_factor: 1
  test_dataloader: ${data.val_dataloader}  # variable interpolation comes in handy again
  stats_manager:
    _target_: nequip.data.CommonDataStatisticsManager
    dataloader_kwargs:
      batch_size: 10
    type_names: ${model_type_names}

trainer:
  _target_: lightning.Trainer
  accelerator: gpu
  enable_checkpointing: true
  max_epochs: 1500
  max_time: 04:00:00:00
  check_val_every_n_epoch: 1
  log_every_n_steps: 10
  logger:
    _target_: lightning.pytorch.loggers.wandb.WandbLogger
    project: allegro_AuMgO_check
    name: sr_AuMgO_r55_nlayer2_lmax1_check
    save_dir: ${hydra:runtime.output_dir}  # use resolver to place wandb logs in hydra's output directory

  callbacks:
    # stop training when some criterion is met
    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: ${monitored_metric}            # validation metric to monitor
      min_delta: 1e-4                         # how much to be considered a "change"
      patience: 300                           # how many instances of "no change" before stopping

    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      monitor: ${monitored_metric}            # validation metric to monitor
      dirpath: ${hydra:runtime.output_dir}    # use hydra output directory
      filename: best                          # best.ckpt is the checkpoint name
      save_last: true                         # last.ckpt will be saved

    # log learning rate, e.g. to monitor what the learning rate scheduler is doing
    - _target_: lightning.pytorch.callbacks.LearningRateMonitor
      logging_interval: epoch

# NOTE:
# interpolation parameters for Allegro model
num_scalar_features: 128 


training_module:
  _target_: nequip.train.EMALightningModule
  loss:
    _target_: nequip.train.EnergyForceLoss
    per_atom_energy: true
    coeffs:
      total_energy: 1.0
      forces: 1.0
  val_metrics:
    _target_: nequip.train.EnergyForceMetrics
    coeffs:
      per_atom_energy_mae: 1.0
      forces_mae: 1.0
  test_metrics: ${training_module.val_metrics}
  optimizer:
    _target_: torch.optim.Adam
    lr: 0.001
  # ^ IMPORTANT: Allegro models do better with learning rates around 1e-3
  lr_scheduler:
    # any torch compatible lr sceduler
    scheduler:
      _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
      factor: 0.8
      patience: 50
      threshold: 0.2
      min_lr: 1e-6
    monitor: ${monitored_metric}
    interval: epoch
    frequency: 1

  # to use the Allegro model in the NequIP framework, the following `model` block has to be changed to be that of Allegro's
  # see Allegro model docs for explanation of model hyperparameters:
  # https://nequip.readthedocs.io/projects/allegro/en/latest/guide/allegro_model.html
  model:
    #_target_: allegro.model.AllegroModel
    _target_: nequip.model.ModelFromCheckpoint
    checkpoint_path: /global/scratch/users/dongjinkim/NequIP-LES/allegro-Au-MgO/outputs/2025-08-29/10-10-28/best.ckpt 

global_options:
  allow_tf32: false
